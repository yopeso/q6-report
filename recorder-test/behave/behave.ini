# Laid out as a real suite is, including show_skipped off, which hides a skipped scenario from every formatter.
[behave]
format = q6_report.behave_recorder:Recorder
paths = features
stdout_capture = false
stderr_capture = false
show_skipped = false

# The folder a suite saves its screenshots into, which the recorder looks in, as the @shot_once scenarios use.
[behave.userdata]
q6_report.screenshots = screenshots
