# A tag v<version> releases that version: every check runs, the packages are built, and once a maintainer approves the
# release environment they go to Maven Central, npm and PyPI, then come back from there into the recorder test.
# No job reads a cache, which another run could have written, and no checkout keeps its credentials, as no step pushes.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    secrets:
      Q6_REPORT_PRIVATE_NAMES: ${{ secrets.Q6_REPORT_PRIVATE_NAMES }}

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit, because a tag can be moved to other code; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile

      - name: The tag is the version every part carries
        run: node scripts/version.mjs check "${GITHUB_REF_NAME#v}"

      # pnpm pack writes the manifest a registry serves, from publishConfig. The wheel builds as the recorder test builds
      # it, with the setuptools pinned in its requirements.txt, so the published wheel comes from the tested build.
      # The Maven files are this version's folder of the publication, without the maven-metadata.xml beside it, as a
      # bundle for Maven Central holds, and unsigned, as only the publish job holds the key.
      - name: Build the npm package, the wheel and the Maven files
        run: |
          pnpm pack --pack-destination out/npm
          python3 -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/pip" install --quiet -r recorder-test/behave/requirements.txt
          "$RUNNER_TEMP/wheel-venv/bin/pip" wheel --quiet --no-deps --no-build-isolation -w out/pypi recorders/python
          recorders/junit5/gradlew --project-dir recorders/junit5 --no-daemon --quiet publishAllPublicationsToBuildRepository
          folder="io/github/qa-automation-q6/q6-report-junit5/${GITHUB_REF_NAME#v}"
          mkdir -p "out/maven/$folder"
          cp "recorders/junit5/build/repo/$folder/"* "out/maven/$folder/"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: out/
          if-no-files-found: error

  # One job behind one approval publishes everywhere, Maven Central first: Central checks the bundle and holds it
  # unpublished until the last step, so a bundle it refuses stops the release before anything is public.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    # npm and PyPI take the release through trusted publishing, from this workflow's identity, so neither keeps a token.
    # Maven Central's token and signing key are secrets of the release environment, given only to the steps that use them.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: out/

      # Central wants a signature beside every file but the checksums, and its GPG page says it verifies only against a
      # primary key, so the key is one that signs with its primary key and has no passphrase, as README.md says under
      # Releasing.
      - name: Sign the JUnit 5 recorder and have Maven Central check it, unless the version is already there
        id: maven
        env:
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          folder="io/github/qa-automation-q6/q6-report-junit5/$version"
          if curl --silent --fail --head --output /dev/null "https://repo1.maven.org/maven2/$folder/q6-report-junit5-$version.pom"; then
            echo "q6-report-junit5 $version is already on Maven Central, and a published version is never replaced"
            exit 0
          fi
          if [ -z "$MAVEN_SIGNING_KEY" ]; then
            echo "MAVEN_SIGNING_KEY is empty: the key that signs for Maven Central, kept as a secret of the release environment, as README.md says under Releasing" >&2
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s\n' "$MAVEN_SIGNING_KEY" | gpg --batch --quiet --import
          for file in "out/maven/$folder"/*; do
            case "$file" in *.md5 | *.sha1 | *.sha256 | *.sha512) continue ;; esac
            if ! gpg --batch --quiet --pinentry-mode loopback --passphrase '' --armor --detach-sign "$file"; then
              echo "MAVEN_SIGNING_KEY could not sign $file: it has to be a key with no passphrase, made as README.md says under Releasing" >&2
              exit 1
            fi
          done
          (cd out/maven && zip --quiet --recurse-paths "$RUNNER_TEMP/central-bundle.zip" io)
          deployment="$(node scripts/maven-central.mjs upload "$RUNNER_TEMP/central-bundle.zip" "io.github.qa-automation-q6:q6-report-junit5:$version")"
          echo "deployment=$deployment" >> "$GITHUB_OUTPUT"

      # A version already on npm stays as it is, e.g: the first one, which has to be uploaded by hand. An npm older than
      # 11.5.1 has no trusted publishing, and would fail asking for a token.
      - name: Publish to npm, unless the version is already there
        run: |
          npm_version="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "$npm_version" | sort -V | head -n 1)" != 11.5.1 ]; then
            echo "npm $npm_version has no trusted publishing, which needs 11.5.1 or newer; raise node-version above" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          if npm view "q6-report@$version" version > /dev/null 2>&1; then
            echo "q6-report $version is already on npm, and a published version is never replaced"
          else
            npm publish "out/npm/q6-report-$version.tgz" --access public
          fi

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: out/pypi/

      - name: Publish the JUnit 5 recorder Maven Central checked
        if: steps.maven.outputs.deployment != ''
        env:
          DEPLOYMENT: ${{ steps.maven.outputs.deployment }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
        run: node scripts/maven-central.mjs publish "$DEPLOYMENT"

      # A checked deployment the release stopped before publishing goes, so a run again starts from a Portal with none.
      - name: Drop the checked JUnit 5 recorder, as the release stopped before publishing it
        if: failure() && steps.maven.outputs.deployment != ''
        env:
          DEPLOYMENT: ${{ steps.maven.outputs.deployment }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
        run: node scripts/maven-central.mjs drop "$DEPLOYMENT"

  installed:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # The recorder test on what a team downloads: the command from npm, the behave recorder from PyPI and the JUnit 5
      # recorder from Maven Central.
      - name: Each recorder writes exactly what it must, from the packages just published
        env:
          Q6_REPORT_FROM_REGISTRY: ${{ github.ref_name }}
        run: Q6_REPORT_FROM_REGISTRY="${Q6_REPORT_FROM_REGISTRY#v}" pnpm check:recorders
